<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVERA LOGIN</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

    <div class="relative min-h-screen w-full overflow-hidden">


        <img
            src="../Assets/background web.jpeg"
            alt="Background"
            class="absolute inset-0 w-full h-full object-cover"
        >


        <div class="relative z-10 min-h-screen w-full md:w-[50%] flex items-center justify-center bg-white/25 backdrop-blur-md border-r border-white/40 shadow-[0_8px_32px_rgba(0,0,0,0.1)]">

          
            <div class="w-full max-w-md px-10 py-12">

          
                <div class="mb-8">
                    <h1 class="text-2xl font-bold text-white">
                        Login Your Account
                    </h1>

                    <p class="text-white/80 text-base">
                        Login Your Account Right Here!
                    </p>
                </div>

                <form action="#" method="POST" class="space-y-5">
                    <input
                        type="email"
                        name="email"
                        placeholder="Email"
                        required
                        class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/10 text-white placeholder-white outline-none focus:bg-white/20 focus:border-white/40 transition duration-300"
                    >

                    <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        required
                        class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/10 text-white placeholder-white outline-none focus:bg-white/20 focus:border-white/40 transition duration-300"
                    >

                  
                    <p class="text-sm text-white/90 px-1">
                        Don't you have an account yet?
                        <a href="../Frontend/SignUp.html" class="text-cyan-200 hover:text-white transition">
                            Sign Up
                        </a>
                    </p>

                  
                    <button
                        href="../Frontend/User/user.html"
                        type="submit"
                        class="w-1/2 py-2.5 rounded-full border border-white/50 text-white text-xl font-medium shadow-sm hover:bg-white/20 hover:scale-105 transition duration-300">
                        LOGIN
                    </button>

                </form>
            </div>
        </div>

    </div>

</body>
</html>
